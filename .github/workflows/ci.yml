name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The declared minimum (package.json engines, set by @earendil-works/pi-tui) and the current LTS.
        node: ["22.19", 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Install the published package as users get it, refusing an engine mismatch, and run it.
      - run: npm pack
      - run: npm install -g --engine-strict ./happier-tui-*.tgz
      - run: happier-tui --help
